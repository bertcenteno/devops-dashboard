services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: devops-dashboard:1.0.0
    container_name: devops-dashboard
    ports:
      - "5000:5000"
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: mariadb:11.8
    container_name: devops-dashboard-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro

volumes:
  db_data:
