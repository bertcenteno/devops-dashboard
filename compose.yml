services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: devops-dashboard:1.0.0
    container_name: devops-dashboard
    ports:
      - "5000:5000"
    environment:
      APP_ENVIRONMENT: sit
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: devops_dashboard
      DB_USER: root
      DB_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.8
    container_name: devops-dashboard-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: devops_dashboard

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro

volumes:
  db_data:
