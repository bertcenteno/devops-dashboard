services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: devops-dashboard:1.0.0
    container_name: devops-dashboard
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: devops_dashboard
      DB_USER: root
      DB_PASSWORD: ${MARIADB_ROOT_PASSWORD}

  db:
    image: mariadb:11.8
    container_name: devops-dashboard-db
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: devops_dashboard
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro

volumes:
  db_data:
